<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
<script src="/app-play.js"></script>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <meta name="theme-color" content="#f5f2ec"/>
  <title>Assinatura de contrato · Fieldo Locação</title>
  <!-- Página com dados pessoais, aberta por link individual: fora do índice.
       Mesma regra de relatorio.html/avaliar.html (meta noindex, sem Disallow). -->
  <meta name="robots" content="noindex,nofollow"/>
  <meta name="referrer" content="no-referrer"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../fieldo.css"/>
  <style>
    body { background: var(--bg); padding-bottom: 3rem; }
    .as-main { max-width: 640px; margin: 0 auto; padding: 1.1rem 1.1rem 2rem; }
    .as-brand { font-family: var(--mono); font-size: .62rem; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); margin: .4rem 0 1rem; }
    .as-box { background: var(--paper); border: 1px solid var(--border); border-radius: var(--r-l, 14px); padding: 1rem 1.1rem; margin-bottom: 1rem; }
    .as-box h2 { font-size: 1rem; margin: 0 0 .6rem; font-weight: 600; }
    .as-res { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem .9rem; font-size: .84rem; }
    .as-res b { display: block; font-family: var(--mono); font-size: .6rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 400; }
    .as-doc { background: #fff; color: #1c1a17; border: 1px solid var(--border); border-radius: 10px; padding: 1.1rem 1.15rem; font-size: .88rem; line-height: 1.62; max-height: 65vh; overflow-y: auto; }
    .as-doc .ctr-h1 { font-size: 1.05rem; text-align: center; margin: .2rem 0 .4rem; }
    .as-doc .ctr-h2 { font-size: .93rem; margin: 1rem 0 .35rem; border-bottom: 1px solid #ddd; padding-bottom: .2rem; }
    .as-doc .ctr-h3 { font-size: .87rem; margin: .75rem 0 .25rem; }
    .as-doc .ctr-p { margin: .3rem 0; } .as-doc .ctr-ul { margin: .3rem 0 .3rem 1.1rem; padding: 0; }
    .as-meta { font-family: var(--mono); font-size: .66rem; color: var(--muted); line-height: 1.6; word-break: break-all; }
    .as-msg { border-radius: 8px; padding: .75rem .85rem; font-size: .86rem; line-height: 1.55; margin-bottom: 1rem; }
    .as-ok { background: var(--green-bg); border: 1px solid var(--green-bd); color: var(--green); }
    .as-av { background: var(--amber-bg); border: 1px solid var(--amber-bd); color: var(--amber); }
    .as-er { background: var(--red-bg); border: 1px solid var(--red-bd); color: var(--red); }
    .as-canvas { width: 100%; height: 160px; border: 1px dashed var(--border2); border-radius: 8px; background: #fff; touch-action: none; display: block; }
    .as-acts { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .7rem; }
    .as-check { display: flex; gap: .6rem; align-items: flex-start; font-size: .86rem; line-height: 1.5; margin: .4rem 0 .9rem; }
    .as-check input { margin-top: .28rem; width: 1.1rem; height: 1.1rem; flex: none; }
    /* v12.6 · auditoria de UX: o resumo virava 6 rótulos empilhados no
       celular. Agora fica em duas colunas, com partes na largura toda e o
       valor em destaque; os blocos são os passos que de fato são. */
    .as-res .inteira { grid-column: 1 / -1; }
    .as-res > div { min-width: 0; overflow-wrap: anywhere; }
    .as-valor { font-family: var(--serif); font-size: 1.6rem; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .as-res .as-datas { font-size: .95rem; font-weight: 500; }
    .as-topo h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(1.5rem, 6vw, 2rem); line-height: 1.15; margin: 0 0 .35rem; text-wrap: balance; }
    .as-topo p { margin: 0 0 1.1rem; color: var(--text2); font-size: .95rem; line-height: 1.5; }
    .as-passo { display: inline-grid; place-items: center; width: 1.6rem; height: 1.6rem; border-radius: 50%; border: 1px solid var(--gold);
      color: var(--gold-text); font: 500 .78rem var(--mono); margin-right: .5rem; vertical-align: 1px; }
    .as-recusar { background: none; border: 0; padding: .4rem 0; font: 500 .82rem var(--sans); color: var(--red);
      text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
    .as-recusar:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    @media print {
      body * { visibility: hidden; }
      #asDoc, #asDoc * { visibility: visible; }
      #asDoc { position: absolute; left: 0; top: 0; max-height: none; overflow: visible; border: 0; }
    }
  </style>
</head>
<body>
<main class="as-main">
  <div class="as-brand">Fieldo Locação · Contrato digital</div>
  <div id="app" aria-live="polite"><div class="as-box"><p class="as-meta">Carregando o contrato…</p></div></div>
</main>

<script>window.FIELDO_APP_NS = 'loc';</script>
<script src="../db.js"></script>
<script src="../db.locacao.js"></script>
<script src="../db.locacao.contratos.js"></script>
<script src="./contrato-doc.js"></script>
<script src="./assinatura-pad.js"></script>
<script src="./contrato-pdf.js"></script>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');

  function falha(msg) { app.innerHTML = '<div class="as-msg as-er" role="alert">' + msg + '</div>'; }

  if (typeof FIELDO === 'undefined' || typeof FIELDO_LOCACAO === 'undefined' || !FIELDO_LOCACAO.Contratos ||
      typeof FieldoContratoDoc === 'undefined') {
    falha('A página não carregou por completo. Verifique a conexão e recarregue.');
    return;
  }
  var C = FIELDO_LOCACAO.Contratos, Doc = FieldoContratoDoc;
  function e(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* token no fragmento (#t=...): não vai para servidores nem para logs */
  var m = /[#&]t=([^&]+)/.exec(location.hash || '');
  var token = m ? decodeURIComponent(m[1]) : '';
  if (!token) { falha('Link incompleto. Abra o link exatamente como recebeu ou peça um novo à locadora.'); return; }

  var dados = null, pad = null;

  function carregar() {
    app.innerHTML = '<div class="as-box"><p class="as-meta">Carregando o contrato…</p></div>';
    C.porToken(token).then(function (r) {
      if (!r || !r.ok) {
        falha(e(C.MSG[r && r.error] || 'Não foi possível abrir este contrato.') +
          '<br>Se precisar, fale com a locadora que enviou o link.');
        return;
      }
      dados = r; render();
    }).catch(function () {
      app.innerHTML = '<div class="as-msg as-er" role="alert">Sem conexão com o servidor. Verifique a internet.</div>' +
        '<button type="button" class="btn btn--primary" id="asTentar">Tentar de novo</button>';
      document.getElementById('asTentar').onclick = carregar;
    });
  }

  function render() {
    var c = dados.contrato, res = dados.resumo || {}, ass = dados.assinaturas || [];
    var cliAss = ass.filter(function (a) { return a.parte === 'locatario'; })[0];
    var h = '';

    if (c.status === 'assinado') {
      h += '<div class="as-msg as-ok">Contrato assinado por todas as partes em ' + e(Doc.fmtDataHora(c.concluido_em)) + '.</div>';
    } else if (cliAss) {
      h += '<div class="as-msg as-ok">Sua assinatura foi registrada em ' + e(Doc.fmtDataHora(cliAss.assinado_em)) +
           '. Falta a assinatura da locadora; o documento final ficará disponível neste mesmo link.</div>';
    }

    var passo = function (n) { return dados.pode_assinar ? '<span class="as-passo" aria-hidden="true">' + n + '</span>' : ''; };
    if (dados.pode_assinar) {
      h += '<div class="as-topo"><h1>Contrato de locação para assinar</h1>' +
        '<p>' + e(res.locadora || 'A locadora') + ' enviou este contrato. Confira o resumo, leia o texto completo e assine no fim da página.</p></div>';
    }

    h += '<div class="as-box"><h2>' + passo(1) + 'Contrato ' + e(c.numero) + ' · versão ' + e(c.versao) + '</h2><div class="as-res">' +
      '<div class="inteira"><b>Valor total</b><span class="as-valor">' + e(res.valor_total != null ? Doc.brl(res.valor_total) : 'A combinar') + '</span></div>' +
      '<div><b>Retirada</b><span class="as-datas">' + e(Doc.fmtData(res.data_saida)) + '</span></div><div><b>Devolução prevista</b><span class="as-datas">' + e(Doc.fmtData(res.data_prevista_devolucao)) + '</span></div>' +
      '<div class="inteira"><b>Locadora</b>' + e(res.locadora) + '</div><div class="inteira"><b>Locatário(a)</b>' + e(res.cliente) + '</div>' +
      '<div class="inteira"><b>Este link vale até</b>' + e(Doc.fmtDataHora(c.token_expira_em)) + '</div>' +
      '</div></div>';

    h += '<div class="as-box"><h2>' + passo(2) + 'Leia o contrato completo</h2><p class="as-meta" id="asInteg">Conferindo integridade…</p>' +
      '<div class="as-doc" id="asDoc">' + Doc.toHtml(c.documento_texto) + '</div>' +
      '<p class="as-meta">Código de integridade (SHA-256): ' + e(c.documento_hash) + '</p>' +
      '<div class="as-acts">' + (c.status === 'assinado'
        ? '<button type="button" class="btn btn--primary btn--sm" id="asPdf">Baixar PDF final</button>'
        : '<button type="button" class="btn btn--ghost btn--sm" id="asImprimir">Imprimir ou salvar cópia</button>') +
      '</div></div>';

    if (dados.pode_assinar) {
      h += '<div class="as-box"><h2>' + passo(3) + 'Assinar</h2>' +
        '<div class="field-group" style="margin-bottom:.8rem"><label class="field-label" for="asNome">Seu nome completo <span class="required">*</span></label>' +
        '<input class="field-input" id="asNome" autocomplete="name" value="' + e(res.cliente || '') + '"/></div>' +
        '<div class="field-group" style="margin-bottom:.8rem"><label class="field-label" for="asDoc2">Confirme seu CPF ou CNPJ <span class="required">*</span></label>' +
        '<input class="field-input" id="asDoc2" inputmode="numeric" autocomplete="off" placeholder="' +
          e(res.documento_dica ? 'O do contrato termina em ' + res.documento_dica.replace('final ', '') : '') + '"/></div>' +
        '<label class="as-check"><input type="checkbox" id="asAceite"/><span>' + e(Doc.ACEITE_CLIENTE) + '</span></label>' +
        '<div class="field-label">Desenhe sua assinatura (opcional)</div>' +
        '<canvas class="as-canvas" id="asPad" aria-label="Área para desenhar a assinatura"></canvas>' +
        '<div class="as-acts"><button type="button" class="btn btn--ghost btn--sm" id="asLimpar">Limpar desenho</button></div>' +
        '<div id="asErro"></div>' +
        '<button type="button" class="btn btn--primary btn--lg" style="width:100%;margin-top:.8rem" id="asAssinar">Assinar contrato</button>' +
        '<p class="as-meta" style="margin-top:.8rem">Ao assinar, registramos data e hora, a versão e o código do documento, ' +
        'seu nome e documento, o endereço IP e o navegador usado, para comprovar o aceite (LGPD, art. 7º, V e VI).</p>' +
        '<div class="as-acts"><button type="button" class="as-recusar" id="asRecusar">Não concordo com o contrato</button></div>' +
        '</div>';
    }

    app.innerHTML = h;

    Doc.sha256(c.documento_texto).then(function (hx) {
      document.getElementById('asInteg').innerHTML = hx === c.documento_hash
        ? '<span style="color:var(--green)">Integridade conferida: este é exatamente o texto registrado.</span>'
        : '<span style="color:var(--red)">Atenção: o texto não corresponde ao código registrado. Não assine e fale com a locadora.</span>';
      if (hx !== c.documento_hash) { var b = document.getElementById('asAssinar'); if (b) b.disabled = true; }
    }).catch(function () {
      document.getElementById('asInteg').textContent = 'Seu navegador não permite conferir a integridade aqui.';
    });

    var bi = document.getElementById('asImprimir'); if (bi) bi.onclick = function () { window.print(); };
    var bp = document.getElementById('asPdf'); if (bp) bp.onclick = baixarPdf;
    if (dados.pode_assinar) {
      pad = AssinaturaPad(document.getElementById('asPad'));
      document.getElementById('asLimpar').onclick = function () { pad.limpar(); };
      document.getElementById('asAssinar').onclick = assinar;
      document.getElementById('asRecusar').onclick = recusar;
    }
  }

  function erro(msg) {
    var el = document.getElementById('asErro');
    el.innerHTML = '<div class="as-msg as-er" role="alert" style="margin:.6rem 0 0">' + e(msg) + '</div>';
  }

  function assinar() {
    var nome = document.getElementById('asNome').value.trim();
    var doc = document.getElementById('asDoc2').value.trim();
    if (nome.length < 3) return erro('Informe seu nome completo.');
    if (!Doc.docValido(doc)) return erro('Informe um CPF ou CNPJ válido.');
    if (!document.getElementById('asAceite').checked) return erro('Marque a confirmação de leitura e aceite.');
    var btn = document.getElementById('asAssinar');
    btn.disabled = true; btn.textContent = 'Registrando assinatura…';
    C.assinarCliente(token, nome, doc, Doc.ACEITE_VERSAO, Doc.ACEITE_CLIENTE, pad.png())
      .then(function () { window.scrollTo(0, 0); carregar(); })
      .catch(function (err) {
        btn.disabled = false; btn.textContent = 'Assinar contrato';
        erro(err && err.code ? err.message : 'Sem conexão. Sua assinatura não foi registrada; tente de novo.');
      });
  }

  function recusar() {
    var motivo = prompt('Se quiser, diga o motivo para a locadora (opcional):', '');
    if (motivo === null) return;
    if (!confirm('Confirmar que você NÃO concorda com este contrato?')) return;
    C.recusar(token, motivo).then(function () {
      app.innerHTML = '<div class="as-msg as-av">Você recusou este contrato. A recusa ficou registrada para a locadora, que pode enviar uma nova versão.</div>';
    }).catch(function (err) { erro(err && err.code ? err.message : 'Sem conexão. Tente de novo.'); });
  }

  function baixarPdf() {
    var b = document.getElementById('asPdf');
    b.disabled = true; b.textContent = 'Gerando PDF…';
    FieldoContratoPdf.gerar(dados.contrato, dados.assinaturas || []).then(function (blob) {
      var url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = 'contrato-' + dados.contrato.numero + '-v' + dados.contrato.versao + '.pdf';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      b.disabled = false; b.textContent = 'Baixar PDF final';
    }).catch(function () {
      b.disabled = false; b.textContent = 'Baixar PDF final';
      alert('Não foi possível gerar o PDF. Verifique a conexão e tente de novo.');
    });
  }

  carregar();
})();
</script>
<script src="/dados-legais.js" defer></script>
<script src="/consentimento.js" defer></script>
<script src="/a11y.js" defer></script>
</body>
</html>
