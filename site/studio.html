<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
<script src="/app-play.js"></script>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <meta name="theme-color" content="#0e0e14"/>
  <meta name="robots" content="noindex,nofollow"/>
  <title>Fieldo Studio · seus serviços em vídeo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <!-- o vídeo usa itálico de verdade (Fraunces 400/500 itálico) e DM Sans até 800 -->
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,500&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="fieldo.css"/>
  <link rel="manifest" href="manifest.json"/>
  <style>
    /* v12.41 · Fieldo Studio. Um passo por vez: escolher o serviço →
       ajustar com a prévia ao vivo → gerar no aparelho → compartilhar. */
    body { background: var(--bg); }
    .st { max-width: 1040px; margin: 0 auto; padding: .75rem 1rem 7.5rem; }
    .st-top { display: flex; align-items: center; justify-content: space-between; gap: .75rem; min-height: 48px; }
    .st-voltar { display: inline-flex; align-items: center; gap: .3rem; color: var(--text2); font-size: .88rem; text-decoration: none; min-height: 44px; background: none; border: 0; padding: 0; cursor: pointer; font-family: var(--sans); }
    .st-cota { font: 500 .72rem var(--mono); letter-spacing: .02em; color: var(--gold-text); background: var(--gold-bg); border: 1px solid var(--gold-bd); border-radius: 999px; padding: .32rem .7rem; white-space: nowrap; }
    .st-cota--zero { color: var(--red); background: var(--red-bg); border-color: var(--red-bd); }
    .st-eyebrow { font: 500 .7rem var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin: .9rem 0 .35rem; }
    .st-tit { font-family: var(--serif); font-weight: 400; font-size: clamp(1.7rem, 6.4vw, 2.3rem); line-height: 1.08; color: var(--ink); margin: 0 0 .5rem; letter-spacing: -.01em; }
    .st-tit em { font-style: italic; color: var(--gold); }
    .st-sub { font-size: .93rem; color: var(--text2); line-height: 1.55; margin: 0 0 1.1rem; max-width: 36rem; }
    .st-h2 { font: 600 1rem var(--sans); color: var(--text); margin: 1.6rem 0 .65rem; display: flex; align-items: baseline; justify-content: space-between; gap: .5rem; }
    .st-h2 small { font: 400 .78rem var(--sans); color: var(--muted); }
    .st-box { background: var(--paper); border: 1px solid var(--border2); border-radius: 16px; padding: .95rem 1rem; }
    .st-alerta { display: flex; gap: .7rem; align-items: flex-start; background: var(--amber-bg); border: 1px solid var(--amber-bd); color: var(--amber); border-radius: 12px; padding: .75rem .85rem; font-size: .86rem; line-height: 1.5; margin: 0 0 .7rem; }
    .st-alerta b { color: var(--text); font-weight: 600; }
    .st-alerta a, .st-lnk { color: var(--gold-d); font-weight: 600; text-decoration: none; white-space: nowrap; }
    .st-erro { background: var(--red-bg); border-color: var(--red-bd); color: var(--red); }

    /* lista de serviços */
    .st-lista { list-style: none; margin: 0; padding: 0; display: grid; gap: .55rem; }
    .st-sv { display: grid; grid-template-columns: 64px 1fr auto; gap: .8rem; align-items: center; width: 100%; text-align: left; background: var(--paper); border: 1px solid var(--border2); border-radius: 14px;
      padding: .55rem .7rem .55rem .55rem; cursor: pointer; font-family: var(--sans); color: var(--text); transition: border-color .2s, transform .15s; min-height: 76px; }
    .st-sv:hover { border-color: var(--gold-bd); }
    .st-sv:active { transform: scale(.99); }
    .st-sv[disabled] { cursor: default; opacity: .72; }
    .st-sv-img { width: 64px; height: 64px; border-radius: 10px; background: var(--paper3) center/cover no-repeat; overflow: hidden; }
    .st-sv-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .st-sv-tit { font-weight: 600; font-size: .93rem; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .st-sv-meta { display: block; font-size: .76rem; color: var(--muted); margin-top: .15rem; }
    .st-sv-motivo { display: block; font-size: .74rem; color: var(--amber); margin-top: .2rem; line-height: 1.35; }
    .st-sv-seta { color: var(--gold); font-size: 1.3rem; padding-left: .2rem; }
    .st-tag { display: inline-block; font: 500 .62rem var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--green); background: var(--green-bg); border: 1px solid var(--green-bd); border-radius: 999px; padding: .1rem .45rem; margin-left: .3rem; vertical-align: 1px; }
    .st-vazio { text-align: center; padding: 1.6rem 1rem; }
    .st-vazio p { color: var(--text2); font-size: .9rem; line-height: 1.55; margin: .4rem auto 1rem; max-width: 26rem; }
    .st-mais { background: none; border: 0; color: var(--gold-d); font: 600 .85rem var(--sans); padding: .6rem 0; cursor: pointer; min-height: 44px; }

    /* meus vídeos */
    .st-vid { display: grid; grid-template-columns: 54px 1fr; gap: .75rem; background: var(--paper); border: 1px solid var(--border2); border-radius: 14px; padding: .6rem .7rem .6rem .6rem; }
    .st-vid--foco { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-bg); }
    .st-vid-img { width: 54px; height: 96px; border-radius: 8px; background: var(--ink) center/cover no-repeat; }
    .st-vid-tit { font-weight: 600; font-size: .9rem; line-height: 1.3; }
    .st-vid-meta { font-size: .74rem; color: var(--muted); margin: .1rem 0 .45rem; }
    .st-num { display: flex; gap: 1.1rem; flex-wrap: wrap; }
    .st-num div { font-size: .72rem; color: var(--muted); line-height: 1.2; }
    .st-num b { display: block; font: 500 1.25rem var(--serif); color: var(--ink); }
    .st-vid-acoes { display: flex; gap: 1rem; margin-top: .35rem; }
    .st-vid-acoes button { background: none; border: 0; padding: .4rem 0; font: 600 .8rem var(--sans); color: var(--gold-d); cursor: pointer; min-height: 40px; }
    .st-vid-acoes .st-perigo { color: var(--muted); font-weight: 500; }

    /* editor */
    .st-ed { display: grid; gap: 1.1rem; grid-template-columns: minmax(0, 1fr); }
    /* sem isto a faixa de gêneros (rolagem horizontal) alarga a coluna e a página estoura no celular */
    .st-ed > * { min-width: 0; }
    @media (min-width: 900px) { .st-ed { grid-template-columns: 380px minmax(0, 1fr); align-items: start; gap: 2rem; } .st-ed-palco { position: sticky; top: 1rem; } }
    /* no celular a prévia deixa ver os controles logo abaixo (≤ 60% da altura) */
    .st-palco { position: relative; width: min(100%, 360px, calc(60vh * 9 / 16)); margin: 0 auto; aspect-ratio: 9 / 16; border-radius: 22px; overflow: hidden; background: #0e0e14; box-shadow: 0 18px 50px rgba(14,14,20,.25); }
    .st-palco canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .st-carregando { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .8rem; color: rgba(255,255,255,.75); font-size: .85rem;
      background: linear-gradient(110deg, #16161f 30%, #22222c 50%, #16161f 70%); background-size: 220% 100%; animation: stBrilho 1.4s linear infinite; text-align: center; padding: 1rem; }
    @keyframes stBrilho { to { background-position: -220% 0; } }
    .st-play { position: absolute; inset: 0; border: 0; background: rgba(14,14,20,.18); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: opacity .25s; }
    .st-play span { width: 74px; height: 74px; border-radius: 50%; background: rgba(255,255,255,.92); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 30px rgba(0,0,0,.3); }
    .st-play.tocando { opacity: 0; }
    .st-play.tocando:focus-visible { opacity: 1; }
    .st-ctrl { display: flex; align-items: center; gap: .45rem; width: min(100%, 420px); margin: .6rem auto 0; }
    .st-ctrl input[type=range] { flex: 1; accent-color: var(--gold); height: 28px; }
    .st-tempo { font: 400 .72rem var(--mono); color: var(--muted); min-width: 4.6rem; text-align: right; white-space: nowrap; }
    .st-hist .st-btn-ico { width: 36px; height: 36px; }
    .st-btn-ico { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border2); background: var(--paper); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; flex: none; }
    .st-musica-status { text-align: center; font-size: .74rem; color: var(--muted); min-height: 1.2em; margin-top: .3rem; }

    .st-sec { background: var(--paper); border: 1px solid var(--border2); border-radius: 16px; padding: .9rem 1rem 1rem; }
    .st-sec + .st-sec { margin-top: .75rem; }
    .st-sec h3 { font: 600 .92rem var(--sans); color: var(--text); margin: 0 0 .7rem; display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; }
    .st-sec h3 small { font-weight: 400; font-size: .74rem; color: var(--muted); }
    .st-modelos { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; }
    .st-modelo { position: relative; border: 1.5px solid var(--border2); border-radius: 12px; padding: .55rem .5rem .6rem; background: var(--paper2); cursor: pointer; text-align: left; font-family: var(--sans); color: var(--text); min-height: 44px; }
    .st-modelo[aria-pressed=true] { border-color: var(--gold); background: var(--gold-bg); }
    .st-modelo i { display: block; height: 54px; border-radius: 8px; margin-bottom: .45rem; }
    .st-modelo b { display: block; font-size: .82rem; }
    .st-modelo small { display: block; font-size: .68rem; color: var(--muted); line-height: 1.3; margin-top: .1rem; }
    .st-cad { position: absolute; top: .35rem; right: .35rem; font: 600 .58rem var(--mono); letter-spacing: .06em; background: var(--ink); color: var(--on-ink); border-radius: 999px; padding: .12rem .4rem; }
    .st-chips { display: flex; flex-wrap: wrap; gap: .4rem; }
    .st-chip { border: 1px solid var(--border2); background: var(--paper2); color: var(--text); border-radius: 999px; padding: .5rem .85rem; font: 500 .82rem var(--sans); cursor: pointer; min-height: 40px; }
    .st-chip[aria-pressed=true] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
    .st-chip small { color: inherit; opacity: .65; font-weight: 400; margin-left: .25rem; }
    .st-modo { display: flex; background: var(--paper2); border-radius: 10px; padding: 3px; margin-bottom: .6rem; }
    .st-modo button { flex: 1; border: 0; background: none; border-radius: 8px; padding: .45rem .2rem; font: 500 .78rem var(--sans); color: var(--text2); cursor: pointer; min-height: 38px; }
    .st-modo button[aria-pressed=true] { background: var(--paper); color: var(--ink); box-shadow: 0 1px 3px rgba(14,14,20,.12); font-weight: 600; }
    .st-grade { display: grid; grid-template-columns: repeat(4, 1fr); gap: .4rem; }
    .st-foto { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; border: 0; padding: 0; cursor: pointer; background: var(--paper3); }
    .st-foto img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity .2s, filter .2s; }
    .st-foto[data-fora="1"] img { opacity: .35; filter: grayscale(.8); }
    .st-foto .st-ok { position: absolute; top: 5px; right: 5px; width: 22px; height: 22px; border-radius: 50%; background: var(--gold); color: #fff; font-size: .72rem; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
    .st-foto[data-fora="1"] .st-ok { background: rgba(255,255,255,.85); color: transparent; border: 1.5px solid var(--border3); }
    .st-papeis { position: absolute; left: 4px; bottom: 4px; display: flex; flex-wrap: wrap; gap: 3px; }
    .st-papeis span { font: 600 .54rem var(--mono); letter-spacing: .05em; background: rgba(14,14,20,.82); color: #fff; border-radius: 4px; padding: .12rem .3rem; }
    .st-papeis .capa { background: var(--gold); }
    .st-dica { font-size: .74rem; color: var(--muted); line-height: 1.45; margin: .55rem 0 0; }
    .st-campo { margin-bottom: .7rem; }
    .st-campo label { display: flex; justify-content: space-between; font-size: .78rem; color: var(--text2); margin-bottom: .3rem; }
    .st-campo label span { font-family: var(--mono); font-size: .7rem; color: var(--muted); }
    .st-campo input { width: 100%; box-sizing: border-box; border: 1px solid var(--border2); background: var(--paper2); border-radius: 10px; padding: .7rem .75rem; font: 400 .95rem var(--sans); color: var(--text); min-height: 46px; }
    .st-campo input:focus { outline: 2px solid var(--gold-bd); border-color: var(--gold); }
    .st-sw { display: flex; gap: .75rem; align-items: flex-start; justify-content: space-between; padding: .35rem 0; }
    .st-sw-txt { font-size: .86rem; line-height: 1.45; color: var(--text); }
    .st-sw-txt small { display: block; color: var(--muted); font-size: .76rem; margin-top: .15rem; }
    .st-sw input { appearance: none; -webkit-appearance: none; width: 46px; height: 28px; border-radius: 999px; background: var(--paper4); position: relative; flex: none; cursor: pointer; transition: background .2s; margin-top: .1rem; }
    .st-sw input::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
    .st-sw input:checked { background: var(--gold); }
    .st-sw input:checked::after { transform: translateX(18px); }
    .st-sw input:disabled { opacity: .5; cursor: not-allowed; }
    .st-aval { background: var(--paper2); border-radius: 10px; padding: .6rem .75rem; font-size: .84rem; color: var(--text2); line-height: 1.5; margin-top: .5rem; font-style: italic; }
    .st-aval b { color: var(--gold); font-style: normal; letter-spacing: .1em; }
    .st-cores { display: flex; gap: .5rem; flex-wrap: wrap; }
    .st-cor { width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--paper); box-shadow: 0 0 0 1px var(--border2); cursor: pointer; }
    .st-cor[aria-pressed=true] { box-shadow: 0 0 0 2px var(--ink); }
    .st-priv { font-size: .74rem; color: var(--muted); line-height: 1.5; margin: .9rem 0 0; display: flex; gap: .45rem; }

    /* barra de ação */
    .st-barra { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--veu); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid var(--border2); padding: .7rem 1rem calc(.7rem + env(safe-area-inset-bottom)); display: none; }
    .st-barra.on { display: block; }
    .st-barra-in { max-width: 1040px; margin: 0 auto; display: flex; align-items: center; gap: .9rem; }
    .st-barra-txt { flex: 1; font-size: .76rem; color: var(--text2); line-height: 1.35; }
    .st-cta { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: 50px; border: 0; border-radius: 13px; background: var(--gold); color: var(--on-gold);
      font: 600 .98rem var(--sans); cursor: pointer; padding: 0 1.4rem; text-decoration: none; }
    .st-cta:disabled { opacity: .5; cursor: not-allowed; }
    .st-cta--full { width: 100%; }
    .st-cta--wa { background: #1d7a46; color: #fff; }
    .st-cta--sec { background: transparent; color: var(--gold-d); border: 1px solid var(--gold-bd); }
    .st-cta--ink { background: var(--ink); color: var(--on-ink); }

    /* gerando / pronto */
    .st-modal { position: fixed; inset: 0; z-index: 100; background: rgba(14,14,20,.92); display: flex; align-items: center; justify-content: center; padding: 1.2rem; }
    .st-gerando { width: min(100%, 360px); text-align: center; color: #fff; }
    .st-gerando canvas { width: 150px; aspect-ratio: 9 / 16; border-radius: 14px; display: block; margin: 0 auto 1.3rem; background: #1e1e28; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
    .st-gerando h2 { font: 400 1.45rem var(--serif); margin: 0 0 .3rem; }
    .st-gerando p { color: rgba(255,255,255,.62); font-size: .86rem; line-height: 1.5; margin: .2rem 0 1rem; }
    .st-prog { height: 8px; border-radius: 999px; background: rgba(255,255,255,.12); overflow: hidden; }
    .st-prog i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--gold-l), #d4ab40); border-radius: inherit; transition: width .25s; }
    .st-pct { font: 500 .8rem var(--mono); color: #d4ab40; margin-top: .5rem; }
    .st-cancelar { background: none; border: 1px solid rgba(255,255,255,.25); color: rgba(255,255,255,.8); border-radius: 10px; padding: .6rem 1.2rem; font: 500 .85rem var(--sans); margin-top: 1.2rem; cursor: pointer; min-height: 44px; }
    .st-pronto { display: grid; gap: 1.2rem; align-items: start; }
    @media (min-width: 900px) { .st-pronto { grid-template-columns: 360px 1fr; gap: 2rem; } }
    .st-pronto video, .st-pronto .st-carrossel { width: min(100%, 340px); aspect-ratio: 9 / 16; border-radius: 20px; background: #000; display: block; margin: 0 auto; box-shadow: 0 18px 50px rgba(14,14,20,.25); }
    .st-carrossel { display: grid !important; grid-template-columns: 1fr 1fr; gap: 4px; overflow-y: auto; padding: 4px; aspect-ratio: auto !important; max-height: 70vh; }
    .st-carrossel img { width: 100%; border-radius: 10px; display: block; }
    .st-acoes { display: grid; gap: .55rem; }
    .st-passos { margin: .6rem 0 0; padding: 0 0 0 1.1rem; font-size: .84rem; color: var(--text2); line-height: 1.7; }
    .st-rastreio { display: flex; gap: .6rem; background: var(--green-bg); border: 1px solid var(--green-bd); border-radius: 12px; padding: .7rem .8rem; font-size: .82rem; color: var(--green); line-height: 1.5; }
    .st-link { font: 400 .72rem var(--mono); color: var(--text2); background: var(--paper2); border-radius: 8px; padding: .55rem .65rem; word-break: break-all; }

    .st-folha { position: fixed; inset: 0; z-index: 120; background: rgba(14,14,20,.5); display: flex; align-items: flex-end; justify-content: center; }
    .st-folha-in { background: var(--paper); width: min(100%, 520px); border-radius: 20px 20px 0 0; padding: 1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom)); box-shadow: 0 -10px 40px rgba(0,0,0,.2); }
    .st-folha h2 { font: 400 1.35rem var(--serif); margin: 0 0 .4rem; color: var(--ink); }
    .st-folha p { font-size: .88rem; color: var(--text2); line-height: 1.55; margin: 0 0 .9rem; }
    .st-folha ul { margin: 0 0 1rem 1.1rem; padding: 0; font-size: .86rem; color: var(--text); line-height: 1.75; }
    /* v12.43 · Studio v2: barra de ferramentas, música, cenas, clipes, final */
    .st-abas { display: flex; gap: .3rem; overflow-x: auto; scrollbar-width: none; margin: 0 0 .75rem; padding: .25rem; background: var(--paper); border: 1px solid var(--border2); border-radius: 14px; position: sticky; top: .4rem; z-index: 5; }
    .st-abas::-webkit-scrollbar { display: none; }
    .st-aba { flex: 1 0 auto; min-width: 64px; display: flex; flex-direction: column; align-items: center; gap: .15rem; border: 0; background: none; border-radius: 10px; padding: .45rem .5rem; font: 500 .7rem var(--sans); color: var(--text2); cursor: pointer; min-height: 52px; }
    .st-aba svg { width: 20px; height: 20px; }
    .st-aba[aria-selected=true] { background: var(--ink); color: var(--on-ink); }
    .st-hist { display: flex; gap: .35rem; }
    .st-hist button:disabled { opacity: .35; cursor: default; }
    .st-generos { display: flex; gap: .35rem; overflow-x: auto; scrollbar-width: none; margin-bottom: .6rem; padding-bottom: .15rem; }
    .st-generos::-webkit-scrollbar { display: none; }
    .st-generos .st-chip { flex: none; min-height: 34px; padding: .35rem .7rem; font-size: .76rem; }
    .st-trilhas { display: grid; gap: .35rem; max-height: 46vh; overflow-y: auto; padding-right: .15rem; }
    .st-trilha { display: grid; grid-template-columns: 1fr auto; gap: .5rem; align-items: center; text-align: left; border: 1px solid var(--border2); background: var(--paper2); border-radius: 12px; padding: .55rem .7rem; cursor: pointer; font-family: var(--sans); color: var(--text); min-height: 52px; }
    .st-trilha b { display: block; font-size: .86rem; }
    .st-trilha small { display: block; font-size: .72rem; color: var(--muted); line-height: 1.35; }
    .st-trilha i { font: 500 .62rem var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--gold-text); font-style: normal; white-space: nowrap; }
    .st-trilha[aria-pressed=true] { border-color: var(--gold); background: var(--gold-bg); box-shadow: inset 3px 0 0 var(--gold); }
    .st-faixa { display: grid; gap: .25rem; margin-top: .55rem; }
    .st-faixa label { display: flex; justify-content: space-between; font-size: .78rem; color: var(--text2); }
    .st-faixa label span { font: 500 .72rem var(--mono); color: var(--muted); }
    .st-faixa input[type=range] { width: 100%; accent-color: var(--gold); height: 28px; }
    .st-arquivo { display: flex; gap: .6rem; align-items: center; justify-content: space-between; background: var(--paper2); border: 1px dashed var(--border3); border-radius: 12px; padding: .65rem .75rem; font-size: .84rem; }
    .st-arquivo b { display: block; font-size: .84rem; word-break: break-all; }
    .st-arquivo small { color: var(--muted); font-size: .72rem; }

    .st-filtro img, .st-filtro i { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; margin-bottom: .3rem; background: linear-gradient(160deg,#9fb8ad,#2a3a36); }

<body>
<main class="st" id="st" aria-live="polite"><p class="st-sub" style="margin-top:2rem">Carregando o Studio…</p></main>
<div class="st-barra" id="stBarra"><div class="st-barra-in"><div class="st-barra-txt" id="stBarraTxt"></div><button type="button" class="st-cta" id="stGerar">Gerar vídeo</button></div></div>
<div id="fieldo-toast" role="status" aria-live="polite" aria-atomic="true"></div>

<script src="db.js"></script>
<script src="db.studio.js"></script>
<script src="qrcode_min.js"></script>
<script src="vendor/mp4-muxer/mp4-muxer-5.2.2.js"></script>
<script src="studio-trilhas.js"></script>
<script src="studio-trilhas-catalogo.js"></script>
<script src="studio-audio.js"></script>
<script src="studio-motor.js"></script>
<script src="studio-export.js"></script>
<script>
(function () {
  'use strict';
  var main = document.getElementById('st');
  var barra = document.getElementById('stBarra'), barraTxt = document.getElementById('stBarraTxt'), btnGerar = document.getElementById('stGerar');
  var params = new URLSearchParams(location.search);
  var S = FIELDO.Studio, MOT = FIELDO.StudioMotor, EXP = FIELDO.StudioExport, TRI = FIELDO.StudioTrilhas;

  if (!S || !MOT || !EXP || !TRI) { main.innerHTML = '<p class="st-sub" style="margin-top:2rem">Não foi possível carregar o Studio. Recarregue a página.</p>'; return; }
  if (!FIELDO.Auth.isLoggedIn()) { location.href = 'entrar.html'; return; }

  var dados = null, videos = [], fotosCache = {}, avatar = null, caps = null;
  var ed = null;           /* estado do editor */
  var player = null;       /* prévia */
  var mostrarTodos = false;

  function e(s) { return FIELDO.UI.esc(s == null ? '' : String(s)); }
  function toast(m) { try { FIELDO.UI.toast(m, 3200); } catch (x) {} }
  function pro() { return !!(dados && dados.cota && dados.cota.plano === 'pro'); }
  function dataBR(iso) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? m[3] + '/' + m[2] + '/' + m[1] : ''; }
  function dataCurta(iso) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? m[3] + '/' + m[2] : ''; }
  function mmss(s) { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  function plural(n, um, varios) { return n + ' ' + (n === 1 ? um : varios); }

  /* ── cota ───────────────────────────────────────────────────── */
  function cotaChip() {
    var c = dados && dados.cota;
    if (!c) return '';
    if (c.limite == null) return '<span class="st-cota">Pro · vídeos ilimitados</span>';
    return '<span class="st-cota' + (c.restante ? '' : ' st-cota--zero') + '">' + c.restante + ' de ' + c.limite + ' vídeos grátis</span>';
  }
  function topo(voltar) {
    return '<div class="st-top">' + (voltar || '<a class="st-voltar" href="painel.html">‹ Painel</a>') + cotaChip() + '</div>';
  }

  /* ── carregar ───────────────────────────────────────────────── */
  function carregar() {
    main.innerHTML = topo() + '<div class="st-eyebrow">Fieldo Studio</div><h1 class="st-tit">Carregando…</h1>';
    Promise.all([S.fontes(), S.meus().catch(function () { return []; }), EXP.capacidades().catch(function () { return null; })]).then(function (r) {
      dados = r[0]; videos = r[1] || []; caps = r[2];
      var rid = params.get('r'), vid = params.get('v');
      if (vid) {
        var v = videos.filter(function (x) { return x.id === vid; })[0];
        if (v && params.get('editar') === '1') return abrirVideo(v);
      }
      if (rid) {
        var sv = servico(rid);
        if (sv && sv.situacao === 'ok') return abrirEditor(sv, null);
      }
      telaInicio(vid);
    }).catch(function (err) {
      main.innerHTML = topo() + '<div class="st-eyebrow">Fieldo Studio</div><h1 class="st-tit">Não deu para abrir agora</h1>' +
        '<div class="st-alerta st-erro" role="alert">' + e(err.message) + '</div>' +
        '<button type="button" class="st-cta st-cta--sec" id="stDeNovo">Tentar de novo</button>';
      document.getElementById('stDeNovo').onclick = carregar;
      if (err.code === 'nao_autenticado') setTimeout(function () { location.href = 'entrar.html'; }, 1500);
    });
  }

  function servico(id) { return ((dados && dados.servicos) || []).filter(function (s) { return s.id === id; })[0] || null; }

  /* ── 1. início: escolher o serviço ──────────────────────────── */
  var MOTIVO = {
    portfolio_desligado: 'Fotos fora do portfólio público',
    servico_privado: 'Serviço privado',
    servico_fora_do_portfolio: 'Fotos deste serviço não liberadas',
    sem_fotos: 'Sem fotos nem vídeos'
  };

  function telaInicio(focoVideo) {
    pararPlayer(); barra.classList.remove('on');
    var p = dados.perfil, c = dados.cota, svs = dados.servicos || [];
    var elegiveis = svs.filter(function (s) { return s.situacao === 'ok'; });
    var outros = svs.filter(function (s) { return s.situacao !== 'ok'; });
    var comVideo = {};
    videos.forEach(function (v) { if (v.gerado_em) comVideo[v.report_id] = true; });

    var h = topo() +
      '<div class="st-eyebrow">Fieldo Studio</div>' +
      '<h1 class="st-tit">Seu trabalho <em>vira vídeo</em></h1>' +
      '<p class="st-sub">Escolha um serviço. Em menos de um minuto sai um vídeo vertical para o Status, Reels e TikTok — com suas fotos e vídeos, música, antes e depois, a avaliação do cliente e o seu contato.</p>';

    if (!p.portfolio_publico) {
      h += '<div class="st-alerta"><div><b>Suas fotos estão fora do portfólio público.</b> O Studio só usa fotos que você liberou para mostrar no perfil. ' +
        '<a href="meu-perfil.html">Liberar no meu perfil →</a></div></div>';
    }
    if (!p.publico || !p.slug) {
      h += '<div class="st-alerta"><div><b>Seu perfil está oculto.</b> O vídeo leva o cliente até o seu perfil, então ele precisa estar público. ' +
        '<a href="meu-perfil.html">Ajustar perfil →</a></div></div>';
    }
    if (c && c.limite != null) {
      h += '<div class="st-box" style="display:flex;gap:.9rem;align-items:center;justify-content:space-between;margin-bottom:.4rem">' +
        '<div style="font-size:.86rem;line-height:1.5;color:var(--text2)">' +
          (c.restante ? 'Você tem <b style="color:var(--ink)">' + plural(c.restante, 'vídeo grátis', 'vídeos grátis') + '</b> este mês.' : '<b style="color:var(--ink)">Os vídeos grátis deste mês acabaram.</b>') +
          ' Renova em ' + e(dataBR(c.renova_em)) + '. Refazer um vídeo já gerado não conta.' +
        '</div><a class="st-lnk" href="planos.html">Pro: ilimitado →</a></div>';
    }

    h += '<h2 class="st-h2">Escolha o serviço <small>' + plural(elegiveis.length, 'pronto', 'prontos') + ' para vídeo</small></h2>';
    if (!svs.length) {
      h += '<div class="st-box st-vazio"><div style="font:400 1.2rem var(--serif);color:var(--ink)">Nenhum serviço com fotos ou vídeos ainda</div>' +
        '<p>Registre um serviço com fotos do antes e do depois, ou um vídeo curto do resultado. Ele aparece aqui na hora, pronto para virar vídeo.</p>' +
        '<a class="st-cta" href="servico.html">Registrar serviço com fotos</a></div>';
    } else {
      var lista = elegiveis.concat(outros), limite = mostrarTodos ? lista.length : 8;
      h += '<ul class="st-lista">' + lista.slice(0, limite).map(function (s) {
        var ok = s.situacao === 'ok', foto = ok && ((s.fotos && s.fotos[0]) || (s.videos && s.videos[0] && s.videos[0].capa));
        return '<li><button type="button" class="st-sv" data-sv="' + e(s.id) + '"' + (ok ? '' : ' disabled aria-disabled="true"') + '>' +
          '<span class="st-sv-img">' + (foto ? '<img src="' + e(foto) + '" alt="" loading="lazy" decoding="async"/>' : '') + '</span>' +
          '<span><span class="st-sv-tit">' + e(s.titulo) + (comVideo[s.id] ? '<span class="st-tag">vídeo feito</span>' : '') + '</span>' +
            '<span class="st-sv-meta">' + e(dataBR(s.data)) + ' · ' + plural(s.total_fotos, 'foto', 'fotos') + (s.total_videos ? ' · ' + plural(s.total_videos, 'vídeo', 'vídeos') : '') + (s.avaliacao ? ' · ' + '★'.repeat(s.avaliacao.nota) : '') + '</span>' +
            (ok ? '' : '<span class="st-sv-motivo">' + e(MOTIVO[s.situacao] || 'Indisponível') + '</span>') + '</span>' +
          '<span class="st-sv-seta" aria-hidden="true">' + (ok ? '›' : '') + '</span>' +
        '</button></li>';
      }).join('') + '</ul>';
      if (lista.length > limite) h += '<button type="button" class="st-mais" id="stMais">Ver todos os ' + lista.length + ' serviços</button>';
      if (outros.length && p.portfolio_publico) {
        h += '<p class="st-dica">Serviços privados ou com fotos não liberadas não entram em vídeo — é o mesmo cuidado do seu perfil público. Para liberar, abra o serviço e marque as fotos como portfólio.</p>';
      }
    }

    if (videos.length) {
      h += '<h2 class="st-h2" id="stMeus">Meus vídeos <small>visitas vindas de cada vídeo</small></h2><ul class="st-lista">' +
        videos.map(function (v) {
          var r = v.roteiro || {}, img = r.capa || (r.fotos || [])[0];
          var meta = v.gerado_em ? 'Gerado em ' + dataBR(v.gerado_em) + (v.compartilhado_em ? ' · compartilhado' : ' · ainda não compartilhado') : 'Rascunho';
          return '<li class="st-vid' + (v.id === focoVideo ? ' st-vid--foco' : '') + '" id="v-' + e(v.id) + '">' +
            '<span class="st-vid-img" style="background-image:url(\'' + e(img || '') + '\')"></span>' +
            '<div><div class="st-vid-tit">' + e(r.titulo || 'Vídeo') + '</div><div class="st-vid-meta">' + e(meta) + '</div>' +
              (v.gerado_em ? '<div class="st-num"><div><b>' + Number(v.visitas || 0) + '</b>visitas ao perfil</div><div><b>' + (Number(v.whatsapp || 0) + Number(v.ligacoes || 0)) + '</b>contatos</div></div>' : '') +
              '<div class="st-vid-acoes"><button type="button" data-abrir="' + e(v.id) + '">' + (v.gerado_em ? 'Abrir e baixar de novo' : 'Continuar') + '</button>' +
              '<button type="button" class="st-perigo" data-excluir="' + e(v.id) + '">Excluir</button></div></div></li>';
        }).join('') + '</ul>' +
        '<p class="st-dica">As visitas contam quem abriu seu perfil pelo link ou QR do vídeo. Suas próprias visitas não entram.</p>';
    }

    main.innerHTML = h;
    Array.prototype.forEach.call(main.querySelectorAll('[data-sv]'), function (b) {
      b.onclick = function () { var sv = servico(b.getAttribute('data-sv')); if (sv) abrirEditor(sv, null); };
    });
    var mais = document.getElementById('stMais');
    if (mais) mais.onclick = function () { mostrarTodos = true; telaInicio(); };
    Array.prototype.forEach.call(main.querySelectorAll('[data-abrir]'), function (b) {
      b.onclick = function () { var v = videos.filter(function (x) { return x.id === b.getAttribute('data-abrir'); })[0]; if (v) abrirVideo(v); };
    });
    Array.prototype.forEach.call(main.querySelectorAll('[data-excluir]'), function (b) {
      b.onclick = function () {
        if (!confirm('Excluir este vídeo da sua lista? O arquivo que você já compartilhou continua onde está.')) return;
        b.disabled = true;
        S.excluir(b.getAttribute('data-excluir')).then(function () {
          videos = videos.filter(function (x) { return x.id !== b.getAttribute('data-excluir'); });
          toast('Vídeo excluído'); telaInicio();
        }).catch(function (err) { b.disabled = false; toast(err.message); });
      };
    });
    if (focoVideo) { var alvo = document.getElementById('v-' + focoVideo); if (alvo) setTimeout(function () { alvo.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 60); }
  }

  function abrirVideo(v) {
    var sv = servico(v.report_id);
    if (!sv || sv.situacao !== 'ok') {
      toast(sv ? (FIELDO.Studio.MSG[sv.situacao] || 'Este serviço não pode mais virar vídeo.') : 'O serviço deste vídeo não existe mais.');
      return telaInicio(v.id);
    }
    abrirEditor(sv, v);
  }

  /* ── 2. editor ──────────────────────────────────────────────────
     v12.43 · Studio v2: ferramentas em abas (como os editores de vídeo
     de celular), desfazer/refazer, clipes de vídeo, música do aparelho,
     linha do tempo editável e encerramentos. */
  var AUDIO = FIELDO.StudioAudio;
  var videosCache = {};
  var ABAS = [
    ['midia', 'Mídia', '<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>'],
    ['musica', 'Música', '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>'],
    ['cenas', 'Cenas', '<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M7 6v12M12 6v12M17 6v12"/>'],
    ['texto', 'Texto', '<path d="M4 7V4h16v3M9 20h6M12 4v16"/>'],
    ['estilo', 'Estilo', '<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/>'],
    ['final', 'Final', '<path d="M4 4h16v12H5.17L4 17.17z"/><path d="M8 9h8M8 12h5"/>']
  ];
  var NOMES_FILTRO = { nenhum: 'Original', vivo: 'Vivo', quente: 'Quente', frio: 'Frio', pb: 'P&B', cinema: 'Cinema', suave: 'Suave' };
  var CSS_FILTRO = { nenhum: 'none', vivo: 'saturate(1.35) contrast(1.08)', quente: 'sepia(.22) saturate(1.25) hue-rotate(-6deg)', frio: 'saturate(1.05) hue-rotate(10deg) brightness(1.03)', pb: 'grayscale(1) contrast(1.12)', cinema: 'contrast(1.16) saturate(.82) brightness(.95)', suave: 'brightness(1.06) contrast(.92) saturate(.9)' };
  var NOMES_TRANS = { modelo: 'Do modelo', fade: 'Esmaecer', deslizar: 'Deslizar', zoom: 'Zoom', cortina: 'Cortina', flash: 'Flash', corte: 'Corte seco', desfoque: 'Desfoque' };
  var FINS = [
    ['cartao', 'Cartão', 'Foto, nome, frase, QR e link do perfil'],
    ['whatsapp', 'WhatsApp', 'Seu número em destaque para chamar'],
    ['contato', 'Contato', 'WhatsApp, Instagram e perfil em lista'],
    ['logo', 'Só a marca', 'Sua foto e seu nome, limpo'],
    ['nenhum', 'Sem final', 'O vídeo termina na última cena']
  ];

  function abrirEditor(sv, video) {
    var fotosSv = (sv.fotos || []).filter(function (u) { return typeof u === 'string'; });
    var videosSv = (sv.videos || []).filter(function (v) { return v && typeof v.url === 'string'; });
    var r = video && video.roteiro ? JSON.parse(JSON.stringify(video.roteiro)) : null;
    ed = {
      sv: sv, video: video || null, fotosSv: fotosSv, videosSv: videosSv,
      modelo: video ? video.modelo : 'classico', trilha: video ? video.trilha : 'leve',
      marca: video ? video.marca !== false : true,
      roteiro: r, modo: 'incluir', antesDepois: r ? !!(r.antes && r.depois) : fotosSv.length >= 2,
      pronto: false, aba: 'midia', genero: '', cenaSel: null, arquivo: null,
      hist: [], futuro: []
    };
    if (!pro()) { ed.modelo = 'classico'; ed.marca = true; if (ed.roteiro) delete ed.roteiro.acento; }
    desenharEditor();
    var avatarUrl = dados.perfil.foto;
    var urls = fotosSv.slice(0, 16);
    MOT.fontesProntas().then(function () {
      return MOT.prepararFotos(urls.concat(avatarUrl && !fotosCache.__avatar ? [avatarUrl] : []), function (f, t) {
        var c = document.getElementById('stCarregandoTxt'); if (c) c.textContent = 'Preparando suas fotos… ' + f + ' de ' + t;
      });
    }).then(function (res) {
      if (ed.sv !== sv) return null;
      Object.keys(res.fotos).forEach(function (u) { fotosCache[u] = res.fotos[u]; });
      if (avatarUrl && res.fotos[avatarUrl]) fotosCache.__avatar = res.fotos[avatarUrl];
      if (res.falhas.length) toast(plural(res.falhas.length, 'foto não abriu', 'fotos não abriram') + ' e ficou de fora.');
      var faltam = videosSv.filter(function (v) { return !videosCache[v.url]; });
      return MOT.prepararVideos(faltam, function (f, t) {
        var c = document.getElementById('stCarregandoTxt'); if (c) c.textContent = 'Preparando seus vídeos… ' + f + ' de ' + t;
      });
    }).then(function (rv) {
      if (!rv || ed.sv !== sv) return;
      Object.keys(rv.videos).forEach(function (u) { videosCache[u] = rv.videos[u]; });
      if (rv.falhas.length) toast(plural(rv.falhas.length, 'vídeo não abriu', 'vídeos não abriram') + ' neste aparelho e ficou de fora.');
      ed.fotosSv = fotosSv.filter(function (u) { return fotosCache[u]; });
      ed.videosSv = videosSv.filter(function (v) { return videosCache[v.url]; });
      if (!ed.fotosSv.length && !ed.videosSv.length) {
        main.querySelector('.st-carregando').innerHTML = 'Não conseguimos abrir as fotos e vídeos deste serviço.<br><button type="button" class="st-cta st-cta--sec" style="margin-top:.8rem" onclick="location.reload()">Tentar de novo</button>';
        return;
      }
      if (!ed.roteiro) {
        var mapa = {}; ed.fotosSv.forEach(function (u) { mapa[u] = fotosCache[u]; });
        ed.roteiro = MOT.sugerirRoteiro({ titulo: sv.titulo, categoria: sv.categoria, fotos: ed.fotosSv, videos: ed.videosSv, avaliacao: sv.avaliacao }, mapa, videosCache);
      } else {

        '<ol class="st-passos"><li><b>Status do WhatsApp:</b> Status → galeria → escolha o vídeo.</li><li><b>Reels ou TikTok:</b> novo post → galeria → o vídeo já está no tamanho certo.</li><li>Na legenda, cole o link do seu perfil.</li></ol>' +
        '<div class="st-link" id="stLink">' + e(link) + '</div>' +
        '<button type="button" class="st-cta st-cta--sec st-cta--full" id="stCopiar">Copiar link do perfil</button>' +
        '<div class="st-rastreio"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex:none"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></svg>' +
          '<span>Quem abrir seu perfil pelo QR ou pelo link deste vídeo aparece em <b>Meus vídeos</b>. Quando chegar a primeira visita, avisamos você.</span></div>' +
        '<button type="button" class="st-cta st-cta--ink st-cta--full" id="stOutro">Fazer vídeo de outro serviço</button>' +
      '</div></div>';

    document.getElementById('stVoltarIni').onclick = function () { soltarBlobs(); ed = null; telaInicio(v.id); };
    document.getElementById('stOutro').onclick = function () { soltarBlobs(); ed = null; telaInicio(); };
    var bs = document.getElementById('stShare');
    if (bs) bs.onclick = function () {
      navigator.share({ files: arquivos, text: texto, title: 'Meu trabalho no Fieldo' }).then(function () {
        S.compartilhado(v.id); v.compartilhado_em = v.compartilhado_em || new Date().toISOString(); toast('Compartilhado!');
      }).catch(function (err) { if (!err || err.name !== 'AbortError') toast('Não deu para abrir o compartilhamento. Use o Baixar.'); });
    };
    document.getElementById('stBaixar').onclick = function () {
      arquivos.forEach(function (f, i) {
        setTimeout(function () {
          var u = URL.createObjectURL(f), a = document.createElement('a');
          a.href = u; a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
          setTimeout(function () { URL.revokeObjectURL(u); }, 8000);
        }, i * 350);
      });
      S.compartilhado(v.id);
      toast(out.blob ? 'Vídeo salvo no aparelho.' : 'Imagens salvas no aparelho.');
    };
    document.getElementById('stCopiar').onclick = function () {
      var ok = function () { toast('Link copiado.'); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(ok, function () { selecionar(); });
      else selecionar();
      function selecionar() { var r = document.createRange(); r.selectNodeContents(document.getElementById('stLink')); var s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Selecionado: copie o link.'); }
    };
    window.scrollTo(0, 0);
  }

  /* ── folhas de plano ────────────────────────────────────────── */
  function folha(html) {
    var f = document.createElement('div');
    f.className = 'st-folha';
    f.innerHTML = '<div class="st-folha-in" role="dialog" aria-modal="true">' + html + '</div>';
    f.onclick = function (ev) { if (ev.target === f || ev.target.hasAttribute('data-fechar')) f.remove(); };
    document.body.appendChild(f);
    var foco = f.querySelector('a,button'); if (foco) foco.focus();
  }
  function folhaPro(titulo) {
    folha('<h2>' + e(titulo) + '</h2><p>Com o Fieldo Pro, o Studio fica completo:</p>' +
      '<ul><li>Vídeos ilimitados, todo mês</li><li>Modelos Impacto e Editorial</li><li>Cor de destaque e vídeo sem a marca do Fieldo</li></ul>' +
      '<a class="st-cta st-cta--full" href="planos.html">Conhecer o Pro</a><button type="button" class="st-cta st-cta--sec st-cta--full" style="margin-top:.5rem" data-fechar>Agora não</button>');
  }
  function folhaCota() {
    var c = dados.cota || {};
    folha('<h2>Os ' + (c.limite || 2) + ' vídeos grátis de ' + new Date().toLocaleDateString('pt-BR', { month: 'long' }) + ' já foram</h2>' +
      '<p>A cota renova em ' + e(dataBR(c.renova_em)) + '. Os vídeos que você já fez podem ser refeitos e baixados de novo à vontade.</p>' +
      '<ul><li>No Pro, vídeos ilimitados e todos os modelos</li></ul>' +
      '<a class="st-cta st-cta--full" href="planos.html">Ver o Pro</a><button type="button" class="st-cta st-cta--sec st-cta--full" style="margin-top:.5rem" data-fechar>Entendi</button>');
  }

  window.addEventListener('pagehide', function () { pararPlayer(); soltarBlobs(); });
  carregar();
})();
</script>
<script src="/dados-legais.js" defer></script>
<script src="/a11y.js" defer></script>
